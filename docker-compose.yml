version: '3.9'

services:
  web:
    build: .
    container_name: whisper_app
    ports:
      - "5001:5001"
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:alpine
    container_name: whisper_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts
    container_name: whisper_jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

volumes:
  jenkins_home:
