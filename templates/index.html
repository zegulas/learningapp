<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pronunciation Trainer</title>
  <link rel="stylesheet" href="static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      z-index: 9999;
    }
  </style>
  <script>
    {% if not name %}
    document.addEventListener("DOMContentLoaded", () => {
      const loading = document.createElement("div");
      loading.id = "loading";
      loading.innerText = "Redirecting to login...";
      document.body.appendChild(loading);
      setTimeout(() => {
        window.location.href = "/login";
      }, 500);
    });
    {% endif %}
  </script>
</head>

<body>
  <div class="container">
    <h1>Language Teacher Mumbai</h1>

    <p>Welcome, <strong>{{ name }}</strong>! <a href="/logout">Logout</a></p>

    <!-- Native Language Selector -->
    <div style="margin-bottom: 1em;">
      <label for="nativeLangSelect">Choose your native language:</label>
      <select id="nativeLangSelect">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="mr">Marathi</option>
      </select>
    </div>

    <!-- Phrase Selector -->
    <div>
      <label for="phraseSelect">Choose a phrase:</label>
      <select id="phraseSelect"></select>
    </div>

    <!-- Phrase Display Section -->
    <div class="phrase-display">
      <p><strong><span id="nativeLangLabel">Your Language</span>:</strong> <span id="englishText"></span></p>
      <p><strong>German:</strong> <span id="targetText"></span></p>
      <p><strong>German (Phonetic):</strong> <span id="phoneticTargetText"></span></p>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button onclick="playPhrase()">🔊 Play</button>
      <button onclick="recordSpeech()">🎙️ Record</button>
      <select id="modeToggle">
        <option value="browser">Browser API (Free)</option>
        <option value="whisper">OpenAI Whisper</option>
        <option value="fast-whisper">Fast Whisper (Free)</option>
        <option value="azure">Azure STT</option>
      </select>
    </div>

    <div id="feedback"></div>
    <canvas id="scoreChart" style="margin-top: 30px;"></canvas>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      updatePhraseOptions();
      document.getElementById("nativeLangSelect").addEventListener("change", updatePhraseOptions);
    });
  </script>
  <script src="static/script.js"></script>
</body>

</html>
